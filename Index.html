<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Next Best Hire is Waiting 💼</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #eff6ff, #f8fafc);
      padding: 16px;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 440px;
      width: 100%;
    }
    img {
      width: 170px;
      height: 170px;
      object-fit: contain;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      color: #0f172a;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    p.subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      position: relative;
      min-height: 60px;
    }
    button {
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    #btn-yes {
      background-color: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    #btn-no {
      background-color: #f1f5f9;
      color: #64748b;
      position: relative;
    }
    #booking-screen { display: none; }
    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin: 14px 0 6px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      outline: none;
    }
    #btn-submit {
      margin-top: 22px;
      width: 100%;
      background-color: #16a34a;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
    }
  </style>
</head>
<body>

  <!-- Screen 1: The Candidate Pitch -->
  <div class="card" id="main-screen">
    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpqd2ZxdmVodmYxbnhueWRmMzI2ZzB5OWYzbXExanE4bGJicHJjayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9IbxxvDUQM/giphy.gif" alt="Business Cat Candidate">
    <h1>I reviewed your company.<br>Would you like to interview me?</h1>
    <p class="subtitle">(Ghosting this applicant is currently out of service)</p>
    
    <div class="btn-group">
      <button id="btn-yes">Send Interview Invite 🤝</button>
      <button id="btn-no">Pass on top talent 📉</button>
    </div>
  </div>

  <!-- Screen 2: Scheduling the Candidate -->
  <div class="card" id="booking-screen">
    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExajlzNzg2d2phZ2tueDVhcWJ1eWk1cXFpMnF0ejJvaGFwczk2c3RhNyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/unQ3IJU2RG7DO/giphy.gif" alt="Typing Fast">
    <h1>Excellent corporate decision! ☕</h1>
    
    <label for="interview-date">When does the hiring manager want to meet?</label>
    <input type="date" id="interview-date">

    <label for="interview-time">What time should I dress up for?</label>
    <input type="time" id="interview-time">

    <label for="interview-vibe">How are we running this round?</label>
    <select id="interview-vibe">
      <option value="Google Meet">Online Video Call (Virtual background ready)</option>
      <option value="Office Coffee">On-site Coffee (I bring my best elevator pitch)</option>
      <option value="Offer Direct">Skip right to the offer letter 🎉</option>
    </select>

    <button id="btn-submit">Confirm Invitation 📌</button>
  </div>

  <script>
    const btnNo = document.getElementById('btn-no');
    const btnYes = document.getElementById('btn-yes');
    const mainScreen = document.getElementById('main-screen');
    const bookingScreen = document.getElementById('booking-screen');
    const btnSubmit = document.getElementById('btn-submit');

    function escapeCursor() {
      const maxX = 120;
      const maxY = 70;
      const randomX = (Math.random() - 0.5) * 2 * maxX;
      const randomY = (Math.random() - 0.5) * 2 * maxY;
      btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    btnNo.addEventListener('mouseenter', escapeCursor);
    btnNo.addEventListener('touchstart', (e) => {
      e.preventDefault();
      escapeCursor();
    });

    btnYes.addEventListener('click', () => {
      mainScreen.style.display = 'none';
      bookingScreen.style.display = 'block';
    });

    btnSubmit.addEventListener('click', () => {
      const date = document.getElementById('interview-date').value;
      const time = document.getElementById('interview-time').value;
      const vibe = document.getElementById('interview-vibe').value;

      if (!date || !time) {
        alert('Please pick a date and time to secure this top talent! 📝');
        return;
      }

      alert(`Interview booked for ${date} at ${time} via [${vibe}]! Please take a screenshot and send it to the candidate 🚀`);
    });
  </script>
</body>
</html>
